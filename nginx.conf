upstream leads_app {
    server web:8000;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 50M;

    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # /media/ é NEGADO POR PADRÃO, e só o logo da loja é liberado.
    #
    # Antes era o contrário (alias em /media/ inteiro) e isso deixava toda
    # foto, áudio e documento que clientes mandaram no WhatsApp — de TODAS as
    # empresas — baixável por qualquer pessoa, sem login, só chutando o id
    # sequencial em /media/inbox_midia/AAAA/MM/<id>.<ext>.
    #
    # Mídia de cliente sai EXCLUSIVAMENTE por /crm/inbox/midia/<id>/, que
    # exige login e confere a empresa. Liberar por lista (negar inbox_midia e
    # deixar o resto aberto) é frágil: a próxima pasta privada que alguém
    # criar aqui nasce exposta. Negar por padrão não tem esse problema.
    location /media/empresas/ {
        alias /app/media/empresas/;
        expires 7d;
    }

    # 404 em vez de 403: não confirma nem que o arquivo existe.
    location /media/ {
        return 404;
    }

    location / {
        proxy_pass http://leads_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        # Timeout para operacoes longas (import de dados)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health check
    location /health/ {
        proxy_pass http://leads_app;
        proxy_set_header Host $host;
        access_log off;
    }
}
