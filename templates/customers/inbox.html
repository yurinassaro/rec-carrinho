{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox WhatsApp — {{ request.tenant.nome|default:"CRM" }}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #e5ddd5; height: 100vh; overflow: hidden; }
  .topbar { background: #075E54; color: white; padding: 10px 20px; display: flex; align-items: center; gap: 16px; height: 50px; }
  .topbar h1 { font-size: 1.1rem; font-weight: 500; }
  .topbar a { color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.85; }
  .topbar a:hover { opacity: 1; }
  .topbar .grow { flex: 1; }
  /* Foto da loja: redonda como no WhatsApp. Fundo branco porque logo com fundo
     transparente sumiria no verde da barra. */
  .topbar .logo-empresa {
    width: 34px; height: 34px; border-radius: 50%; object-fit: contain;
    background: #fff; padding: 2px; flex: none;
  }
  .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #25d366; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .container { display: flex; height: calc(100vh - 50px); background: #f0f2f5; }

  .sidebar { width: 380px; background: white; border-right: 1px solid #d1d7db; display: flex; flex-direction: column; }
  .search { padding: 10px 14px; background: #f0f2f5; }
  .search input { width: 100%; padding: 8px 14px; border: none; border-radius: 8px; background: white; font-size: 14px; outline: none; }
  .conversas { flex: 1; overflow-y: auto; }
  .conv-item { padding: 12px 14px; border-bottom: 1px solid #f0f2f5; cursor: pointer; display: flex; gap: 12px; transition: background 0.1s; }
  .conv-item:hover { background: #f5f6f6; }
  .conv-item.active { background: #f0f2f5; }
  .conv-avatar { width: 44px; height: 44px; border-radius: 50%; background: #00a884; color: white; display: flex; align-items: center; justify-content: center; font-weight: 600; flex-shrink: 0; text-transform: uppercase; }
  .conv-info { flex: 1; min-width: 0; }
  .conv-name { font-weight: 500; font-size: 14px; color: #111b21; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .conv-time { font-size: 11px; color: #667781; font-weight: 400; flex-shrink: 0; }
  .conv-preview { font-size: 13px; color: #667781; margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
  .conv-preview span.preview-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .badge-unread { background: #25d366; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; font-weight: 600; min-width: 20px; text-align: center; }
  .conv-meta-small { font-size: 11px; color: #999; margin-top: 2px; }

  /* Filtros da fila de atendimento */
  .filtros { display: flex; gap: 6px; padding: 0 10px 10px; background: #f0f2f5; flex-wrap: wrap; }
  .chip { border: 1px solid #d1d7db; background: white; color: #54656f; font-size: 12px; padding: 5px 10px; border-radius: 14px; cursor: pointer; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip:hover { background: #e9edef; }
  .chip.on { background: #00a884; border-color: #00a884; color: white; }
  .chip .n { background: rgba(0,0,0,0.08); border-radius: 8px; padding: 0 5px; font-weight: 600; font-size: 11px; }
  .chip.on .n { background: rgba(255,255,255,0.25); }
  .fila-vazia { padding: 30px 20px; text-align: center; color: #667781; font-size: 13px; line-height: 1.5; }

  /* Sinalização da janela de 24h e da espera, na lista */
  .conv-tags { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .tag-janela { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: #d9fdd3; color: #0f7a3d; }
  .tag-janela.pouco { background: #fff3cd; color: #8a5a00; }
  .tag-janela.fechada { background: #eceff1; color: #78909c; font-weight: 500; }
  .tag-espera { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 10px; background: #fdecea; color: #b3261e; }

  .chat { flex: 1; display: flex; flex-direction: column; background: #efeae2; }
  .chat-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #54656f; font-size: 14px; }
  .chat-header { background: #f0f2f5; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d1d7db; }
  .chat-header .conv-avatar { width: 40px; height: 40px; font-size: 14px; }
  .chat-header .meta { flex: 1; }
  .chat-header .nome { font-weight: 500; color: #111b21; }
  .chat-header .tel { font-size: 12px; color: #667781; }
  .chat-header .badge { font-size: 11px; padding: 4px 10px; border-radius: 12px; }
  /* Citação: mesma barrinha verde do WhatsApp, na bolha e no compositor. */
  .citacao { border-left: 3px solid #25d366; background: rgba(0,0,0,0.04); border-radius: 5px; padding: 5px 8px; margin-bottom: 5px; }
  .citacao-autor { font-size: 11px; font-weight: 600; color: #0b7a3e; }
  .citacao-txt { font-size: 12px; color: #667781; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Fica AO LADO da bolha, não em cima: dentro dela tapava o texto curto. */
  .msg.in { align-items: center; }
  .btn-responder {
    visibility: hidden; flex: none; margin-left: 8px; align-self: center;
    background: #f0f2f5; border: 1px solid #d1d7db; border-radius: 10px;
    font-size: 10px; color: #54656f; padding: 3px 7px; cursor: pointer; white-space: nowrap;
  }
  .msg:hover .btn-responder { visibility: visible; }
  .btn-responder:hover { background: #25d366; color: white; border-color: #25d366; }
  /* Sem hover no celular: o botão fica sempre visível. */
  @media (hover: none) { .btn-responder { visibility: visible; } }

  .resp-barra { display: none; align-items: center; gap: 10px; padding: 8px 16px; background: #f0f2f5; border-top: 1px solid #d1d7db; }
  .resp-barra.on { display: flex; }
  .resp-barra .citacao { flex: 1; margin: 0; min-width: 0; }
  .resp-cancelar { background: none; border: none; font-size: 18px; color: #54656f; cursor: pointer; flex: none; }

  /* Mensagens rápidas: painel que sobe do compositor, com busca. */
  .rr-wrap { position: relative; }
  .rr-painel {
    display: none; position: absolute; bottom: 100%; left: 0; right: 0; margin-bottom: 8px;
    background: white; border: 1px solid #d1d7db; border-radius: 10px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.18); max-height: 46vh; overflow: hidden;
    flex-direction: column; z-index: 20;
  }
  .rr-painel.aberto { display: flex; }
  .rr-painel.inline .rr-topo { display: none; }  /* a busca é o próprio campo da mensagem */
  .rr-topo { padding: 10px; border-bottom: 1px solid #e9edef; display: flex; gap: 8px; align-items: center; }
  .rr-topo input { flex: 1; border: 1px solid #d1d7db; border-radius: 16px; padding: 8px 12px; font-size: 14px; outline: none; }
  .rr-topo input:focus { border-color: #25d366; }
  .rr-fechar { background: none; border: none; font-size: 18px; color: #54656f; cursor: pointer; }
  .rr-lista { overflow-y: auto; }
  .rr-item { padding: 10px 14px; border-bottom: 1px solid #f0f2f5; cursor: pointer; }
  .rr-item:hover, .rr-item.sel { background: #f0f2f5; }
  .rr-item-titulo { font-size: 13px; font-weight: 600; color: #111b21; }
  .rr-item-texto { font-size: 12px; color: #667781; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rr-vazio { padding: 18px; text-align: center; color: #667781; font-size: 13px; }
  .rr-dica {
    font-size: 11px; color: #8696a0; padding: 7px 14px; background: #f8f9fa;
    border-top: 1px solid #e9edef; display: flex; gap: 10px; align-items: center;
    justify-content: space-between;
  }
  .rr-dica a { color: #027eb5; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .rr-dica a:hover { text-decoration: underline; }

  /* Aviso da IA: de onde veio a sugestão e o quanto ela confia. O atendente
     precisa saber que aquilo é sugestão, não resposta oficial da loja. */
  .ia-aviso { display: none; padding: 8px 16px; font-size: 12px; background: #e7f3ff; color: #0b4f8a; border-top: 1px solid #cfe4f7; }
  .ia-aviso.on { display: block; }
  .ia-aviso.erro { background: #fdecea; color: #a32018; border-top-color: #f5c6c2; }
  .ia-aviso.baixa { background: #fff3cd; color: #8a5a00; border-top-color: #ffe08a; }
  .ia-aviso b { font-weight: 600; }
  #btnIA.pensando { opacity: 0.6; cursor: progress; }

  .btn-fechar { background: white; border: 1px solid #25d366; color: #0b7a3e; font-size: 12px; font-weight: 600; padding: 5px 11px; border-radius: 14px; cursor: pointer; white-space: nowrap; }
  .btn-fechar:hover { background: #25d366; color: white; }
  .btn-fechar[disabled] { opacity: 0.6; cursor: default; }
  .badge-aberta { background: #25d366; color: white; }
  .badge-aberta.pouco { background: #ffc107; color: #5c3d00; }
  .badge-fechada { background: #d1d7db; color: #54656f; }

  .messages { flex: 1; overflow-y: auto; padding: 20px 60px; scroll-behavior: smooth; }
  .load-more { text-align: center; padding: 10px; color: #54656f; font-size: 12px; cursor: pointer; }
  .load-more:hover { background: rgba(255,255,255,0.5); }
  .msg { margin-bottom: 10px; display: flex; }
  .msg.in { justify-content: flex-start; }
  .msg.out { justify-content: flex-end; }
  .bubble { max-width: 65%; padding: 8px 12px; border-radius: 8px; font-size: 14px; position: relative; word-wrap: break-word; box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); }
  .msg.in .bubble { background: white; border-top-left-radius: 0; }
  .msg.out .bubble { background: #d9fdd3; border-top-right-radius: 0; }
  /* Enquanto o servidor não confirma, a bolha fica um tom apagada (igual ao zap). */
  .msg.out.pendente .bubble { opacity: 0.65; }
  .bubble .body { white-space: pre-wrap; line-height: 1.4; color: #111b21; }
  .bubble .meta { font-size: 11px; color: #667781; text-align: right; margin-top: 4px; display: flex; align-items: center; gap: 4px; justify-content: flex-end; }
  .bubble .tag { display: inline-block; font-size: 10px; background: #ffe5a5; color: #6c4a00; padding: 1px 6px; border-radius: 4px; margin-bottom: 4px; }
  .bubble .tag.template { background: #e3f2fd; color: #1565c0; }
  .bubble .tag.auto { background: #f3e5f5; color: #7b1fa2; }
  .bubble .tag.atend { background: #dcedc8; color: #33691e; }
  .status-icon { font-size: 13px; }
  .status-lido { color: #53bdeb; }

  .composer { background: #f0f2f5; padding: 10px 16px; display: flex; gap: 10px; align-items: flex-end; }
  .composer textarea { flex: 1; border: none; border-radius: 8px; padding: 10px 14px; font-size: 14px; resize: none; min-height: 42px; max-height: 120px; outline: none; font-family: inherit; }
  .composer button, .composer label { background: #54656f; color: white; border-radius: 50%; width: 42px; height: 42px; cursor: pointer; font-size: 18px; display: flex; align-items: center; justify-content: center; border: none; flex-shrink: 0; }
  .composer button.send { background: #00a884; }
  .composer button.send:hover:not(:disabled) { background: #008f72; }
  .composer button:disabled { background: #d1d7db; cursor: not-allowed; }
  .composer-disabled { padding: 16px; background: #fff3cd; color: #6c4a00; font-size: 13px; text-align: center; }
  .file-preview { display: none; background: #fff; border-top: 1px solid #d1d7db; padding: 10px 16px; font-size: 13px; }
  .fp-row { display: flex; align-items: center; gap: 12px; }
  .fp-thumb { width: 60px; height: 60px; border-radius: 8px; object-fit: cover; background: #e9edef; flex: none; display: block; }
  .fp-icon { width: 60px; height: 60px; border-radius: 8px; background: #e9edef; flex: none; display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .fp-info { min-width: 0; flex: 1; }
  .fp-nome { font-weight: 600; color: #111b21; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fp-sub { color: #667781; font-size: 12px; margin-top: 2px; }
  .fp-row audio { height: 36px; max-width: 260px; }
  .fp-remover { background: none; border: none; color: #e53935; cursor: pointer; font-weight: 600; flex: none; }

  /* No celular não cabem as duas colunas: mostra uma por vez, como o WhatsApp.
     A lista é o padrão; abrir uma conversa troca pelo chat, e o ← volta. */
  .voltar-lista { display: none; }
  @media (max-width: 820px) {
    .sidebar { width: 100%; border-right: none; }
    /* min-width:0 nos dois: por padrão um item flex não encolhe abaixo do próprio
       conteúdo, e o compositor fazia o chat ficar mais largo que a tela. */
    .chat { display: none; min-width: 0; }
    .composer textarea { min-width: 0; }
    .container.vendo-chat .sidebar { display: none; }
    .container.vendo-chat .chat { display: flex; }
    .voltar-lista {
      display: flex; align-items: center; justify-content: center;
      background: none; border: none; color: #54656f; font-size: 22px;
      cursor: pointer; padding: 0 4px 0 0; flex: none;
    }
    /* O nome é o que cede: sem isso o cabeçalho estoura a largura da tela e
       empurra o painel das mensagens rápidas pra fora. */
    .chat-header { flex-wrap: wrap; }
    .chat-header .meta { min-width: 0; flex: 1; }
    .chat-header .nome, .chat-header .tel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .btn-fechar { font-size: 11px; padding: 5px 8px; }
    .composer textarea { font-size: 16px; }  /* < 16px o iOS dá zoom ao focar */
  }
</style>
</head>
<body>
<div class="topbar">
  {% if request.tenant.logo %}
    <img class="logo-empresa" src="{{ request.tenant.logo.url }}" alt="{{ request.tenant.nome }}">
  {% endif %}
  <h1>📨 Inbox WhatsApp</h1>
  <span style="opacity:0.7;font-size:0.85rem;">{{ request.tenant.nome }}</span>
  <span class="grow"></span>
  <span class="live-dot" title="Atualização em tempo real"></span>
  <span style="font-size:0.8rem;opacity:0.7;">Live</span>
  <a href="/admin/customers/mensagemwhatsapp/">Admin</a>
  <a href="/crm/">CRM</a>
</div>

<div class="container">
  <div class="sidebar">
    <div class="search">
      <input type="search" id="searchInput" placeholder="Buscar nome, telefone ou texto..." autofocus>
    </div>
    <div class="filtros">
      <button class="chip on" data-filtro="" data-ordem="" title="Todas as conversas, a mais recente primeiro">
        Todas <span class="n" id="nTodas">—</span>
      </button>
      <button class="chip" data-filtro="nao_respondidos" data-ordem="antigos" title="Quem mandou mensagem e ainda não foi respondido — quem espera há mais tempo primeiro">
        ⏳ Não respondidos <span class="n" id="nPendentes">—</span>
      </button>
      <button class="chip" data-filtro="janela_aberta" data-ordem="janela" title="Conversas que ainda aceitam mensagem livre — a janela que fecha antes primeiro">
        🟢 Janela 24h <span class="n" id="nJanela">—</span>
      </button>
    </div>
    <div class="conversas" id="conversasList">
      <div style="padding:30px;text-align:center;color:#667781;">Carregando…</div>
    </div>
  </div>

  <div class="chat" id="chatPane">
    <div class="chat-empty">
      <div style="text-align:center;">
        <div style="font-size:64px;margin-bottom:16px;">💬</div>
        <div>Selecione uma conversa à esquerda</div>
      </div>
    </div>
  </div>
</div>

<script>
const STATE = {
  conversas: [],
  telSelecionado: null,
  mensagens: [],
  convInfo: null,
  janelaAberta: false,
  temMaisHistorico: false,
  carregandoHistorico: false,
  busca: '',
  filtro: '',
  ordem: '',
  contadores: { todas: 0, nao_respondidos: 0, janela_aberta: 0 },
  arquivoAtual: null,
  audioBlob: null,
  gravando: false,
  mediaRecorder: null,
  audioChunks: [],
  previewUrl: null,
  assinaturaConversas: '',  // evita redesenhar a lista quando nada mudou
  respondendo: null,  // mensagem sendo citada na resposta
  respostas: [],      // mensagens prontas, carregadas uma vez
  rrFiltradas: [],
  rrSel: 0,
  rrInline: false,   // true quando o painel está sendo filtrado pelo "/" do próprio campo
};

function getCookie(name) {
  let v = null;
  document.cookie.split(';').forEach(c => {
    c = c.trim();
    if (c.startsWith(name + '=')) v = decodeURIComponent(c.slice(name.length + 1));
  });
  return v;
}

function escapeHtml(s) {
  return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// ============ CONVERSAS ============
async function fetchConversas() {
  try {
    const params = new URLSearchParams();
    if (STATE.busca) params.set('q', STATE.busca);
    if (STATE.filtro) params.set('filtro', STATE.filtro);
    if (STATE.ordem) params.set('ordem', STATE.ordem);
    const qs = params.toString();
    const r = await fetch('/crm/inbox/api/conversas/' + (qs ? '?' + qs : ''));
    const data = await r.json();
    STATE.conversas = data.conversas || [];
    if (data.contadores) STATE.contadores = data.contadores;
    renderContadores();
    // A lista é refeita a cada 10s. Redesenhar quando nada mudou faz a tela
    // piscar e joga o scroll pro topo — parece que a página recarregou sozinha.
    const assinatura = JSON.stringify(STATE.conversas.map(c =>
      [c.telefone, c.ultima_em_label, c.ultima_msg, c.nao_respondidas, c.janela_resta_label, c.espera_label]
    )) + '|' + STATE.telSelecionado;
    if (assinatura !== STATE.assinaturaConversas) {
      STATE.assinaturaConversas = assinatura;
      renderConversas();
    }
  } catch (e) { console.error('Erro fetch conversas:', e); }
}

function renderContadores() {
  const c = STATE.contadores || {};
  const por = { nTodas: c.todas, nPendentes: c.nao_respondidos, nJanela: c.janela_aberta };
  Object.keys(por).forEach(id => {
    const el = document.getElementById(id);
    if (el) el.textContent = (por[id] === undefined ? '—' : por[id]);
  });
}

// A janela de 24h é o que decide se dá para responder com texto livre: verde
// enquanto sobra tempo, amarela nas últimas 2h, cinza quando só template serve.
function tagJanelaHtml(c) {
  if (c.janela_aberta) {
    const pouco = c.janela_resta_min <= 120 ? ' pouco' : '';
    return `<span class="tag-janela${pouco}" title="Pode mandar mensagem livre por mais ${c.janela_resta_label}">`
      + `🟢 janela ${c.janela_resta_label}</span>`;
  }
  return '<span class="tag-janela fechada" title="Fora da janela de 24h — só template aprovado">🔒 janela fechada</span>';
}

function renderConversas() {
  const lista = document.getElementById('conversasList');
  // Sem guardar o scroll, quem rolou a lista pra achar alguém é jogado de volta
  // pro topo a cada atualização.
  const scroll = lista ? lista.scrollTop : 0;
  if (!STATE.conversas.length) {
    const vazio = STATE.filtro === 'nao_respondidos'
      ? '✅ Ninguém esperando resposta.'
      : (STATE.filtro === 'janela_aberta'
        ? 'Nenhuma conversa com janela de 24h aberta agora.'
        : 'Nenhuma conversa.');
    lista.innerHTML = `<div class="fila-vazia">${vazio}</div>`;
    return;
  }
  lista.innerHTML = STATE.conversas.map(c => `
    <div class="conv-item ${c.telefone === STATE.telSelecionado ? 'active' : ''}" data-tel="${c.telefone}">
      <div class="conv-avatar">${escapeHtml((c.nome || '?')[0])}</div>
      <div class="conv-info">
        <div class="conv-name">
          <span>${escapeHtml(c.nome.substring(0, 24))}</span>
          <span class="conv-time">${c.ultima_em_label}</span>
        </div>
        <div class="conv-preview">
          <span class="preview-text">${escapeHtml(c.ultima_msg) || '(sem texto)'}</span>
          ${c.nao_respondidas > 0 ? `<span class="badge-unread">${c.nao_respondidas}</span>` : ''}
        </div>
        <div class="conv-tags">
          ${tagJanelaHtml(c)}
          ${c.nao_respondidas > 0 ? `<span class="tag-espera" title="Esperando resposta há ${c.espera_label}">⏳ espera ${c.espera_label}</span>` : ''}
        </div>
        <div class="conv-meta-small">📱 ${c.telefone} • ${c.total} msgs</div>
      </div>
    </div>
  `).join('');
  lista.querySelectorAll('.conv-item').forEach(el => {
    el.addEventListener('click', () => selecionarConversa(el.dataset.tel));
  });
  lista.scrollTop = scroll;
}

// ============ FILA (filtros) ============
function aplicarFiltro(btn) {
  STATE.filtro = btn.dataset.filtro || '';
  STATE.ordem = btn.dataset.ordem || '';
  document.querySelectorAll('.filtros .chip').forEach(b => b.classList.toggle('on', b === btn));
  const lista = document.getElementById('conversasList');
  if (lista) lista.scrollTop = 0;
  fetchConversas();
}

document.querySelectorAll('.filtros .chip').forEach(btn => {
  btn.addEventListener('click', () => aplicarFiltro(btn));
});

// ============ MENSAGENS ============
async function selecionarConversa(tel) {
  // No celular só cabe um painel: abrir a conversa troca a lista pelo chat.
  document.querySelector('.container').classList.add('vendo-chat');
  if (STATE.telSelecionado === tel) return;
  STATE.telSelecionado = tel;
  STATE.respondendo = null;  // citação não atravessa conversa
  // Nem o rascunho: o renderChat preserva o que está escrito, e sem limpar aqui
  // o texto da conversa anterior apareceria no campo da nova.
  const inpAnterior = document.getElementById('msgInput');
  if (inpAnterior) inpAnterior.value = '';
  STATE.mensagens = [];
  STATE.temMaisHistorico = false;
  renderConversas();
  await fetchMensagens(); // primeira carga
  renderChat();
  scrollToBottom();
}

function voltarParaLista() {
  document.querySelector('.container').classList.remove('vendo-chat');
}

// ============ MENSAGENS RÁPIDAS ============
async function carregarRespostas() {
  try {
    const r = await fetch('/crm/inbox/api/respostas/');
    const data = await r.json();
    STATE.respostas = data.respostas || [];
  } catch (e) {
    STATE.respostas = [];  // sem mensagens prontas o inbox continua funcionando
  }
}

function primeiroNome() {
  const n = (STATE.convInfo && STATE.convInfo.nome) || '';
  const p = n.trim().split(/\s+/)[0];
  return (!p || p === '(sem' ) ? '' : p;
}

function abrirRapidas(termoInicial, inline) {
  // inline = o atendente digitou "/" na mensagem; o foco fica no campo dele,
  // como no WhatsApp. Sem inline (botão ⚡) o painel traz a própria busca.
  const painel = document.getElementById('rrPainel');
  const busca = document.getElementById('rrBusca');
  if (!painel || !busca) return;
  painel.classList.add('aberto');
  painel.classList.toggle('inline', !!inline);
  STATE.rrInline = !!inline;
  busca.value = termoInicial || '';
  filtrarRapidas();
  if (!inline) busca.focus();
}

function fecharRapidas() {
  const painel = document.getElementById('rrPainel');
  if (painel) painel.classList.remove('aberto', 'inline');
  STATE.rrInline = false;
  const inp = document.getElementById('msgInput');
  if (inp) inp.focus();
}

function filtrarRapidas() {
  const termo = (document.getElementById('rrBusca').value || '').toLowerCase().trim();
  const palavras = termo.split(/\s+/).filter(Boolean);
  const casam = STATE.respostas.filter(r => {
    if (!palavras.length) return true;
    const alvo = (r.titulo + ' ' + r.texto + ' ' + (r.atalho || '')).toLowerCase();
    return palavras.every(p => alvo.includes(p));  // todas as palavras, em qualquer ordem
  });

  // "/pix" tem que trazer o pix no topo, não uma mensagem que cita pix no meio
  // do texto — senão o Enter manda a errada. Atalho e título mandam na ordem.
  const peso = r => {
    const atalho = (r.atalho || '').toLowerCase();
    const titulo = (r.titulo || '').toLowerCase();
    if (atalho === termo || titulo === termo) return 0;
    if (atalho.startsWith(termo) || titulo.startsWith(termo)) return 1;
    if (atalho.includes(termo) || titulo.includes(termo)) return 2;
    return 3;  // só o corpo da mensagem casou
  };
  STATE.rrFiltradas = (termo
    ? casam.map((r, i) => ({ r, i }))
           .sort((a, b) => peso(a.r) - peso(b.r) || a.i - b.i)  // empate: ordem do servidor
           .map(x => x.r)
    : casam
  ).slice(0, 60);
  STATE.rrSel = 0;
  renderRapidas();
}

function renderRapidas() {
  const lista = document.getElementById('rrLista');
  if (!lista) return;
  if (!STATE.respostas.length) {
    lista.innerHTML = '<div class="rr-vazio">Nenhuma mensagem pronta cadastrada.<br>Cadastre no Admin → Respostas rápidas.</div>';
    return;
  }
  if (!STATE.rrFiltradas.length) {
    lista.innerHTML = '<div class="rr-vazio">Nada encontrado.</div>';
    return;
  }
  lista.innerHTML = STATE.rrFiltradas.map((r, i) => `
    <div class="rr-item ${i === STATE.rrSel ? 'sel' : ''}" data-i="${i}">
      <div class="rr-item-titulo">${escapeHtml(r.titulo)}</div>
      <div class="rr-item-texto">${escapeHtml(r.texto)}</div>
    </div>
  `).join('');
  lista.querySelectorAll('.rr-item').forEach(el => {
    el.addEventListener('click', () => inserirResposta(STATE.rrFiltradas[+el.dataset.i]));
  });
  const sel = lista.querySelector('.rr-item.sel');
  if (sel) sel.scrollIntoView({ block: 'nearest' });
}

function inserirResposta(r) {
  if (!r) return;
  const inp = document.getElementById('msgInput');
  if (!inp) return;
  // O atendente revisa antes de mandar: a mensagem entra no campo, não no envio.
  inp.value = (r.texto || '').replace(/\{nome\}/g, primeiroNome());
  fecharRapidas();
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  const fd = new FormData();
  fd.append('id', r.id);
  fetch('/crm/inbox/api/respostas/usada/', {
    method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') }, body: fd,
  }).catch(() => {});  // contador é cosmético, não pode atrapalhar o atendimento
}

// ============ RESPONDER CITANDO ============
function responderMensagem(msgId) {
  const m = STATE.mensagens.find(x => x.id === msgId);
  if (!m) return;
  STATE.respondendo = m;
  const barra = document.getElementById('respBarra');
  if (!barra) return;
  document.getElementById('respAutor').textContent = m.is_inbound ? 'Cliente' : 'Você';
  // Mídia não tem texto pra citar: mostra o rótulo em vez de um trecho vazio.
  const rot = { '[image]': '🖼️ Foto', '[audio]': '🎤 Áudio', '[video]': '🎬 Vídeo', '[document]': '📄 Documento' };
  const chave = Object.keys(rot).find(k => (m.texto || '').startsWith(k));
  document.getElementById('respTrecho').textContent =
    chave ? (rot[chave] + ' ' + (m.texto.slice(chave.length).trim())).trim()
          : (m.texto || m.template_name || 'mensagem');
  barra.classList.add('on');
  const inp = document.getElementById('msgInput');
  if (inp) inp.focus();
}

function cancelarResposta() {
  STATE.respondendo = null;
  const barra = document.getElementById('respBarra');
  if (barra) barra.classList.remove('on');
}

// ============ SUGESTÃO DA IA ============
function avisoIA(html, classe) {
  const el = document.getElementById('iaAviso');
  if (!el) return;
  el.className = 'ia-aviso on' + (classe ? ' ' + classe : '');
  el.innerHTML = html;
}

function limparAvisoIA() {
  const el = document.getElementById('iaAviso');
  if (el) el.className = 'ia-aviso';
}

async function sugerirComIA() {
  const btn = document.getElementById('btnIA');
  const inp = document.getElementById('msgInput');
  if (!btn || !inp || !STATE.telSelecionado) return;
  if (btn.classList.contains('pensando')) return;  // a Ana pode levar ~30s

  btn.classList.add('pensando');
  avisoIA('🧠 Pensando… a IA está lendo a conversa.');
  try {
    const fd = new FormData();
    fd.append('telefone', STATE.telSelecionado);
    const r = await fetch('/crm/inbox/sugerir/', {
      method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') }, body: fd,
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.error || 'falhou');

    inp.value = data.resposta || '';
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 180) + 'px';
    inp.focus();

    const quem = data.fonte === 'neuraxo-agent' ? (data.agente || 'Ana') : 'IA';
    const partes = [`🧠 Sugestão de <b>${escapeHtml(quem)}</b> — revise antes de enviar.`];
    if (data.observacao) partes.push(escapeHtml(data.observacao));
    if (data.escalar) partes.push('⚠️ <b>A IA acha que isso precisa de um humano.</b>');
    // Confiança baixa pinta de amarelo: é o sinal pra ler com atenção.
    avisoIA(partes.join(' · '), data.escalar || data.confianca === 'baixa' ? 'baixa' : '');
  } catch (e) {
    avisoIA('🧠 Não consegui sugerir: ' + escapeHtml(e.message), 'erro');
  } finally {
    btn.classList.remove('pensando');
  }
}

function moverSelecaoRapidas(delta) {
  if (!STATE.rrFiltradas.length) return;
  STATE.rrSel = (STATE.rrSel + delta + STATE.rrFiltradas.length) % STATE.rrFiltradas.length;
  renderRapidas();
}

async function fecharConversa() {
  const btn = document.getElementById('btnFechar');
  if (!btn || !STATE.telSelecionado) return;
  btn.disabled = true;
  btn.textContent = 'Fechando…';
  try {
    const fd = new FormData();
    fd.append('telefone', STATE.telSelecionado);
    const r = await fetch('/crm/inbox/fechar/', {
      method: 'POST', headers: { 'X-CSRFToken': getCookie('csrftoken') }, body: fd,
    });
    const data = await r.json();
    if (!data.success) throw new Error(data.error || 'falhou');
    if (STATE.convInfo) STATE.convInfo.nao_respondidas = 0;
    renderChat();
    await fetchConversas();
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '✓ Fechar conversa';
    alert('Não deu para fechar a conversa: ' + e.message);
  }
}

async function fetchMensagens(opts={}) {
  if (!STATE.telSelecionado) return;
  const params = new URLSearchParams({ tel: STATE.telSelecionado });
  if (opts.before_id) params.set('before_id', opts.before_id);
  if (opts.after_id) params.set('after_id', opts.after_id);
  try {
    const r = await fetch('/crm/inbox/api/mensagens/?' + params);
    const data = await r.json();
    if (data.error) return;
    if (opts.before_id) {
      // prepend
      STATE.mensagens = data.mensagens.concat(STATE.mensagens);
    } else if (opts.after_id) {
      // append novas
      const existentes = new Set(STATE.mensagens.map(m => m.id));
      const novas = (data.mensagens || []).filter(m => !existentes.has(m.id));
      if (novas.length) STATE.mensagens = STATE.mensagens.concat(novas);
    } else {
      STATE.mensagens = data.mensagens || [];
    }
    STATE.convInfo = data.conv_info;
    STATE.janelaAberta = data.conv_info && data.conv_info.janela_aberta;
    STATE.temMaisHistorico = data.tem_mais;
    return data;
  } catch (e) { console.error('Erro fetch mensagens:', e); }
}

// renderChat() refaz o HTML inteiro do painel, e isso destrói o compositor.
// Como o polling redesenha a cada mensagem nova, sem guardar o estado o
// atendente perderia o que está digitando no meio de uma frase.
function salvarCompositor() {
  const inp = document.getElementById('msgInput');
  const aviso = document.getElementById('iaAviso');
  const msgs = document.getElementById('messagesEl');
  if (!inp) return null;
  return {
    scrollMsgs: msgs ? msgs.scrollTop : null,
    texto: inp.value,
    selIni: inp.selectionStart,
    selFim: inp.selectionEnd,
    focado: document.activeElement === inp,
    avisoHtml: aviso ? aviso.innerHTML : '',
    avisoClasse: aviso ? aviso.className : '',
  };
}

function restaurarCompositor(salvo) {
  if (!salvo) return;
  // Quem subiu pra reler o histórico não pode ser jogado de volta quando chega
  // mensagem nova. Se estava no fim, quem recoloca lá embaixo é o scrollToBottom.
  const msgs = document.getElementById('messagesEl');
  if (msgs && salvo.scrollMsgs !== null) msgs.scrollTop = salvo.scrollMsgs;
  const inp = document.getElementById('msgInput');
  if (inp) {
    inp.value = salvo.texto;
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
    if (salvo.focado) {
      inp.focus();
      try { inp.setSelectionRange(salvo.selIni, salvo.selFim); } catch (e) { /* campo vazio */ }
    }
  }
  const aviso = document.getElementById('iaAviso');
  if (aviso && salvo.avisoHtml) {
    aviso.innerHTML = salvo.avisoHtml;
    aviso.className = salvo.avisoClasse;
  }
  // A barra de citação também some no re-render, mas STATE.respondendo continua
  // valendo — sem isso a resposta sairia citada sem o atendente estar vendo.
  if (STATE.respondendo) responderMensagem(STATE.respondendo.id);
}

function renderChat() {
  const pane = document.getElementById('chatPane');
  const compositor = salvarCompositor();
  if (!STATE.telSelecionado || !STATE.convInfo) {
    pane.innerHTML = '<div class="chat-empty"><div style="text-align:center;"><div style="font-size:64px;margin-bottom:16px;">💬</div><div>Selecione uma conversa</div></div></div>';
    return;
  }
  const c = STATE.convInfo;
  // Mesmo amarelo da lista quando resta pouco: é aqui, com o atendente digitando,
  // que faltar 1h para a janela fechar precisa aparecer.
  const janelaPouco = c.janela_resta_min <= 120 ? ' pouco' : '';
  const janelaHtml = STATE.janelaAberta
    ? `<span class="badge badge-aberta${janelaPouco}" title="Tempo que resta para responder com mensagem livre">Janela 24h — faltam ${c.janela_resta_label || '—'}</span>`
    : '<span class="badge badge-fechada">Janela fechada</span>';

  const composerHtml = STATE.janelaAberta ? `
    <div class="rr-wrap">
      <div class="ia-aviso" id="iaAviso"></div>
      <div class="resp-barra" id="respBarra">
        <div class="citacao"><div class="citacao-autor" id="respAutor"></div><div class="citacao-txt" id="respTrecho"></div></div>
        <button class="resp-cancelar" id="respCancelar" title="Cancelar resposta">✕</button>
      </div>
      <div class="rr-painel" id="rrPainel">
        <div class="rr-topo">
          <input type="search" id="rrBusca" placeholder="Buscar mensagem pronta..." autocomplete="off">
          <button class="rr-fechar" id="rrFechar" title="Fechar">✕</button>
        </div>
        <div class="rr-lista" id="rrLista"></div>
        <div class="rr-dica">
          <span>↑ ↓ para escolher · Enter insere · Esc fecha</span>
          <a href="{% url 'admin:customers_respostarapida_changelist' %}" target="_blank" rel="noopener"
             title="Abre a página das mensagens prontas: criar, corrigir o texto ou desativar">✏️ Editar as prontas</a>
        </div>
      </div>
      <div class="composer">
        <label for="fileInput" title="Anexar arquivo">📎</label>
        <input type="file" id="fileInput" style="display:none;" accept="image/*,audio/*,video/*,application/pdf">
        <button id="btnAudio" type="button" title="Gravar audio">🎤</button>
        <button id="btnRapidas" type="button" title="Mensagens rápidas (ou digite / na mensagem)">⚡</button>
        <button id="btnIA" type="button" title="Sugerir resposta com a IA — você revisa antes de enviar">🧠</button>
        <textarea id="msgInput" placeholder="Digite sua mensagem... (/pix busca as prontas)" rows="1"></textarea>
        <button id="btnEnviar" class="send" title="Enviar">➤</button>
      </div>
    </div>
    <div class="file-preview" id="filePreview">
      <div class="fp-row" id="fpRow"></div>
    </div>
  ` : `<div class="composer-disabled">⚠️ Janela 24h fechada — envie um template aprovado pelo admin.</div>`;

  // Só aparece com conversa em aberto: ler não tira o aviso, fechar sim.
  const fecharHtml = c.nao_respondidas > 0
    ? `<button class="btn-fechar" id="btnFechar" title="Tira o aviso desta conversa sem mandar mensagem — use quando já foi resolvida">✓ Fechar conversa</button>`
    : '';

  pane.innerHTML = `
    <div class="chat-header">
      <button class="voltar-lista" id="btnVoltarLista" title="Voltar para a lista">←</button>
      <div class="conv-avatar">${escapeHtml((c.nome||'?')[0])}</div>
      <div class="meta">
        <div class="nome">${escapeHtml(c.nome)}</div>
        <div class="tel">📱 ${c.telefone} • ${c.total} mensagens</div>
      </div>
      ${fecharHtml}
      ${janelaHtml}
    </div>
    <div class="messages" id="messagesEl">
      ${STATE.temMaisHistorico ? '<div class="load-more" id="loadMoreBtn">▲ Carregar mensagens anteriores</div>' : ''}
      ${STATE.mensagens.map(renderMsgHtml).join('')}
    </div>
    ${composerHtml}
  `;
  attachChatListeners();
  restaurarCompositor(compositor);
}

function corpoMsgHtml(m) {
  const t = m.texto || '';
  if (m.midia_url && t.startsWith('[audio]')) {
    const legenda = t.replace('[audio]', '').trim();
    return `<audio controls preload="metadata" src="${m.midia_url}" style="max-width:240px;display:block"></audio>` +
      (legenda ? `<div class="body">${escapeHtml(legenda)}</div>` : '');
  }
  if (m.midia_url && t.startsWith('[image]')) {
    const legenda = t.replace('[image]', '').trim();
    return `<a href="${m.midia_url}" target="_blank"><img src="${m.midia_url}" style="max-width:220px;border-radius:8px;display:block" loading="lazy"></a>` +
      (legenda ? `<div class="body">${escapeHtml(legenda)}</div>` : '');
  }
  if (m.midia_url && t.startsWith('[video]')) {
    const legenda = t.replace('[video]', '').trim();
    return `<video controls preload="metadata" src="${m.midia_url}" style="max-width:240px;border-radius:8px;display:block"></video>` +
      (legenda ? `<div class="body">${escapeHtml(legenda)}</div>` : '');
  }
  if (m.midia_url && t.startsWith('[document]')) {
    const legenda = t.replace('[document]', '').trim();
    return `<a href="${m.midia_url}" target="_blank" style="color:#027eb5;font-weight:600">📄 ${escapeHtml(legenda || 'Abrir documento')}</a>`;
  }
  const pend = t.match(/^\[(audio|image|video|document)\]/);
  if (pend) {
    const rotulo = { audio: '🎤 Áudio', image: '🖼️ Foto', video: '🎬 Vídeo', document: '📄 Documento' }[pend[1]];
    const legenda = t.slice(pend[0].length).trim();
    // 'perdida' = a Meta já apagou (ela guarda ~7 dias) ou a mensagem é anterior
    // ao download automático. Dizer "carregando…" aqui seria mentira: nunca chega.
    const aviso = m.midia_estado === 'perdida'
      ? `<span style="font-size:11px" title="A Meta guarda a mídia recebida por cerca de 7 dias. Esta mensagem é mais antiga que isso, ou chegou antes de o download automático existir — o arquivo não dá mais para recuperar.">— não disponível</span>`
      : `<span style="font-size:11px">— carregando…</span>`;
    return `<div class="body" style="color:#667781">${rotulo} ${aviso}</div>` +
      (legenda ? `<div class="body">${escapeHtml(legenda)}</div>` : '');
  }
  return `<div class="body">${escapeHtml(t || '(sem texto)')}</div>`;
}

// Trecho citado dentro da bolha — o mesmo que o cliente vê no WhatsApp dele.
function citacaoHtml(m) {
  if (!m.citada) return '';
  const quem = m.citada.autor === 'cliente' ? 'Cliente' : 'Você';
  return `<div class="citacao"><div class="citacao-autor">${quem}</div>`
    + `<div class="citacao-txt">${escapeHtml(m.citada.trecho || 'mensagem')}</div></div>`;
}

function renderMsgHtml(m) {
  if (m.is_inbound) {
    return `<div class="msg in" data-id="${m.id}"><div class="bubble">
      ${citacaoHtml(m)}
      ${corpoMsgHtml(m)}
      <div class="meta">${m.created_at_label}</div>
    </div>
    <button class="btn-responder" data-responder="${m.id}" title="Responder citando esta mensagem">↩ Responder</button>
    </div>`;
  }
  const tags = [];
  if (m.tipo === 'auto_resposta') tags.push('<span class="tag auto">🤖 Auto-resposta</span>');
  if (m.tipo === 'atendimento_humano') tags.push('<span class="tag atend">👤 Atendente</span>');
  if (m.template_name) tags.push(`<span class="tag template">📋 Template: ${escapeHtml(m.template_name)}</span>`);
  const statusIcon =
    m.status === 'lido' ? '<span class="status-icon status-lido">✓✓</span>' :
    m.status === 'entregue' ? '<span class="status-icon">✓✓</span>' :
    m.status === 'enviado' ? '<span class="status-icon">✓</span>' :
    m.status === 'enviando' ? '<span class="status-icon" title="Enviando…">🕗</span>' :
    m.status === 'falha' ? '<span class="status-icon" style="color:#e53935;">✗ falha</span>' : '';
  return `<div class="msg out${m.pendente ? ' pendente' : ''}" data-id="${m.id}"><div class="bubble">
    ${tags.join('<br>')}${tags.length ? '<br>' : ''}
    ${citacaoHtml(m)}
    ${corpoMsgHtml(m)}
    <div class="meta">${m.created_at_label} ${statusIcon}</div>
  </div></div>`;
}

function attachChatListeners() {
  const file = document.getElementById('fileInput');
  if (file) file.addEventListener('change', previewArquivo);
  const btnA = document.getElementById('btnAudio');
  if (btnA) btnA.addEventListener('click', toggleRecord);
  const btnS = document.getElementById('btnEnviar');
  if (btnS) btnS.addEventListener('click', enviarMensagem);
  const btnR = document.getElementById('btnRapidas');
  if (btnR) btnR.addEventListener('click', () => abrirRapidas(''));
  const btnIA = document.getElementById('btnIA');
  if (btnIA) btnIA.addEventListener('click', sugerirComIA);
  const respC = document.getElementById('respCancelar');
  if (respC) respC.addEventListener('click', cancelarResposta);
  document.querySelectorAll('[data-responder]').forEach(b => {
    b.addEventListener('click', () => responderMensagem(+b.dataset.responder));
  });
  const rrF = document.getElementById('rrFechar');
  if (rrF) rrF.addEventListener('click', fecharRapidas);
  const rrB = document.getElementById('rrBusca');
  if (rrB) {
    rrB.addEventListener('input', filtrarRapidas);
    rrB.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); moverSelecaoRapidas(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); moverSelecaoRapidas(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); inserirResposta(STATE.rrFiltradas[STATE.rrSel]); }
      else if (e.key === 'Escape') { e.preventDefault(); fecharRapidas(); }
    });
  }

  const inp = document.getElementById('msgInput');
  if (inp) {
    inp.addEventListener('keydown', e => {
      // Com o "/" aberto, as setas e o Enter pertencem à lista, não ao envio.
      if (STATE.rrInline) {
        if (e.key === 'ArrowDown') { e.preventDefault(); moverSelecaoRapidas(1); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); moverSelecaoRapidas(-1); return; }
        if (e.key === 'Escape') { e.preventDefault(); fecharRapidas(); return; }
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          inserirResposta(STATE.rrFiltradas[STATE.rrSel]);
          return;
        }
      }
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensagem(); }
    });
    inp.addEventListener('input', () => {
      inp.style.height = 'auto';
      inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
      // Igual ao WhatsApp Business: "/pix" digitado na mensagem vai filtrando
      // as prontas ao vivo, sem tirar o foco de onde o atendente está escrevendo.
      if (inp.value.startsWith('/')) {
        const termo = inp.value.slice(1);
        if (!STATE.rrInline) {
          abrirRapidas(termo, true);
        } else {
          const busca = document.getElementById('rrBusca');
          if (busca) busca.value = termo;
          filtrarRapidas();
        }
      } else if (STATE.rrInline) {
        fecharRapidas();  // apagou a barra: volta a ser uma mensagem normal
      }
    });
  }
  const loadBtn = document.getElementById('loadMoreBtn');
  if (loadBtn) loadBtn.addEventListener('click', carregarHistorico);
  const btnF = document.getElementById('btnFechar');
  if (btnF) btnF.addEventListener('click', fecharConversa);
  const btnV = document.getElementById('btnVoltarLista');
  if (btnV) btnV.addEventListener('click', voltarParaLista);

  // Infinite scroll up
  const msgsEl = document.getElementById('messagesEl');
  if (msgsEl) {
    msgsEl.addEventListener('scroll', () => {
      if (msgsEl.scrollTop < 50 && STATE.temMaisHistorico && !STATE.carregandoHistorico) {
        carregarHistorico();
      }
    });
  }
}

async function carregarHistorico() {
  if (!STATE.mensagens.length || STATE.carregandoHistorico) return;
  STATE.carregandoHistorico = true;
  const beforeId = STATE.mensagens[0].id;
  const msgsEl = document.getElementById('messagesEl');
  const prevHeight = msgsEl ? msgsEl.scrollHeight : 0;
  await fetchMensagens({ before_id: beforeId });
  renderChat();
  const novoEl = document.getElementById('messagesEl');
  if (novoEl) novoEl.scrollTop = novoEl.scrollHeight - prevHeight;
  STATE.carregandoHistorico = false;
}

function scrollToBottom() {
  const el = document.getElementById('messagesEl');
  if (el) el.scrollTop = el.scrollHeight;
}

// ============ ENVIAR ============
function tamanhoLabel(bytes) {
  return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + ' MB' : (bytes / 1024).toFixed(0) + ' KB';
}

// Mostra o que vai ser enviado: miniatura da foto, prévia do vídeo,
// player do áudio gravado — pra conferir ANTES de mandar pro cliente.
function mostrarPreview(blobOuFile, nome, tipo) {
  const row = document.getElementById('fpRow');
  if (!row) return;
  if (STATE.previewUrl) URL.revokeObjectURL(STATE.previewUrl);
  STATE.previewUrl = URL.createObjectURL(blobOuFile);
  const url = STATE.previewUrl;
  const tam = tamanhoLabel(blobOuFile.size);
  let visual, sub;
  if (tipo.startsWith('image/')) {
    visual = `<img class="fp-thumb" src="${url}" alt="">`;
    sub = 'Foto · ' + tam;
  } else if (tipo.startsWith('video/')) {
    visual = `<video class="fp-thumb" src="${url}" muted playsinline preload="metadata"></video>`;
    sub = 'Vídeo · ' + tam + ' — clique para ver';
  } else if (tipo.startsWith('audio/')) {
    visual = `<div class="fp-icon">🎤</div>`;
    sub = `<audio controls preload="metadata" src="${url}"></audio>`;
  } else {
    visual = `<div class="fp-icon">📎</div>`;
    sub = 'Arquivo · ' + tam;
  }
  row.innerHTML = `${visual}
    <div class="fp-info">
      <div class="fp-nome">${escapeHtml(nome)}</div>
      <div class="fp-sub">${sub}</div>
    </div>
    <button class="fp-remover" onclick="limparArquivo()">✗ remover</button>`;
  // vídeo: clicar abre em tela cheia pra conferir antes de enviar
  const v = row.querySelector('video');
  if (v) v.addEventListener('click', () => { v.controls = true; v.play(); });
  document.getElementById('filePreview').style.display = 'block';
}

function previewArquivo() {
  const f = document.getElementById('fileInput').files[0];
  if (f) {
    STATE.arquivoAtual = f;
    STATE.audioBlob = null;
    mostrarPreview(f, f.name, f.type || '');
  }
}
function limparArquivo() {
  STATE.arquivoAtual = null;
  STATE.audioBlob = null;
  if (STATE.previewUrl) { URL.revokeObjectURL(STATE.previewUrl); STATE.previewUrl = null; }
  const f = document.getElementById('fileInput'); if (f) f.value = '';
  const row = document.getElementById('fpRow'); if (row) row.innerHTML = '';
  const fp = document.getElementById('filePreview'); if (fp) fp.style.display = 'none';
}

async function toggleRecord() {
  const btn = document.getElementById('btnAudio');
  if (STATE.gravando) {
    STATE.mediaRecorder.stop();
    STATE.gravando = false;
    btn.textContent = '🎤';
    btn.style.background = '#54656f';
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    STATE.mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
    STATE.audioChunks = [];
    STATE.mediaRecorder.ondataavailable = e => STATE.audioChunks.push(e.data);
    STATE.mediaRecorder.onstop = () => {
      STATE.audioBlob = new Blob(STATE.audioChunks, { type: 'audio/webm' });
      STATE.arquivoAtual = null;
      mostrarPreview(STATE.audioBlob, 'Áudio gravado', 'audio/webm');
      stream.getTracks().forEach(t => t.stop());
    };
    STATE.mediaRecorder.start();
    STATE.gravando = true;
    btn.textContent = '⏹';
    btn.style.background = '#e53935';
  } catch (e) { alert('Erro ao acessar microfone: ' + e.message); }
}

// A bolha que aparece ANTES do servidor responder, igual ao WhatsApp. O servidor
// fica a ~200ms de distância e a Meta a mais 115ms: esperar tudo isso pra só
// então desenhar deixava quase 1s de campo travado a cada mensagem.
function bolhaPendente(texto, arquivo) {
  const d = new Date();
  const dois = n => ('0' + n).slice(-2);
  let marcado = texto;
  if (arquivo) {
    const t = arquivo.type || '';
    const tipo = t.startsWith('image/') ? 'image' : t.startsWith('audio/') ? 'audio'
               : t.startsWith('video/') ? 'video' : 'document';
    marcado = (`[${tipo}] ` + texto).trim();
  }
  const resp = STATE.respondendo;
  return {
    id: -Date.now(),            // negativo = ainda não existe no banco
    pendente: true,
    is_inbound: false,
    tipo: 'atendimento_humano',
    texto: marcado,
    template_name: '',
    status: 'enviando',
    created_at_iso: d.toISOString(),
    created_at_label: `${dois(d.getDate())}/${dois(d.getMonth() + 1)} ${dois(d.getHours())}:${dois(d.getMinutes())}`,
    midia_url: '',
    midia_estado: 'baixando',
    citada: resp ? {
      id: resp.id,
      autor: resp.is_inbound ? 'cliente' : 'loja',
      trecho: (resp.texto || resp.template_name || 'mensagem').slice(0, 90),
    } : null,
  };
}

// Troca a bolha pendente pela mensagem real (ou marca a falha) sem redesenhar a
// tela toda — redesenhar aqui tiraria o foco de quem já está escrevendo a próxima.
function trocarBolha(pendente, real) {
  const i = STATE.mensagens.findIndex(m => m.id === pendente.id);
  const el = document.querySelector(`.msg[data-id="${pendente.id}"]`);
  if (i < 0) { if (el) el.remove(); return; }

  // O polling de 3s pode ter trazido a mesma mensagem no meio do caminho.
  if (real && STATE.mensagens.some(m => m.id === real.id)) {
    STATE.mensagens.splice(i, 1);
    if (el) el.remove();
    return;
  }
  const novo = real || { ...pendente, pendente: false, status: 'falha' };
  STATE.mensagens[i] = novo;
  if (el) el.outerHTML = renderMsgHtml(novo);
}

async function enviarMensagem() {
  const inp = document.getElementById('msgInput');
  const btn = document.getElementById('btnEnviar');
  const texto = inp.value.trim();
  if (!texto && !STATE.arquivoAtual && !STATE.audioBlob) return;

  const arquivo = STATE.arquivoAtual || STATE.audioBlob || null;
  const respondendoId = STATE.respondendo ? STATE.respondendo.id : '';
  const pendente = bolhaPendente(texto, arquivo);

  // Tela limpa NA HORA: a bolha entra, o campo esvazia, o cursor fica onde está.
  STATE.mensagens.push(pendente);
  const msgsEl = document.getElementById('messagesEl');
  if (msgsEl) msgsEl.insertAdjacentHTML('beforeend', renderMsgHtml(pendente));
  inp.value = '';
  inp.style.height = 'auto';
  limparArquivo();
  cancelarResposta();
  scrollToBottom();
  inp.focus();

  try {
    let r;
    if (arquivo) {
      const fd = new FormData();
      fd.append('telefone', STATE.telSelecionado);
      fd.append('texto', texto);
      fd.append('arquivo', arquivo, arquivo.name || 'audio.webm');
      if (respondendoId) fd.append('responder_msg_id', respondendoId);
      r = await fetch('/crm/inbox/enviar/', {
        method: 'POST',
        headers: { 'X-CSRFToken': getCookie('csrftoken') },
        body: fd,
      });
    } else {
      r = await fetch('/crm/inbox/enviar/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
        body: JSON.stringify({
          telefone: STATE.telSelecionado, texto: texto,
          responder_msg_id: respondendoId,
        }),
      });
    }
    const data = await r.json();
    if (data.success) {
      trocarBolha(pendente, data.mensagem || null);
      scrollToBottom();
      fetchConversas();   // a lateral pode esperar: não segura o envio
    } else {
      trocarBolha(pendente, null);
      // O texto volta pro campo: ninguém reescreve uma mensagem perdida.
      if (texto && !inp.value) { inp.value = texto; inp.focus(); }
      alert('Erro: ' + (data.error || 'desconhecido'));
    }
  } catch (e) {
    trocarBolha(pendente, null);
    if (texto && !inp.value) { inp.value = texto; inp.focus(); }
    alert('Erro de rede: ' + e.message);
  }
}

// ============ POLLING ============
async function pollNovasMensagens() {
  if (!STATE.telSelecionado || !STATE.mensagens.length) return;
  // A bolha otimista tem id negativo (ainda não existe no banco) — quem manda no
  // "a partir de qual id" é a última mensagem que o servidor já conhece.
  const salvas = STATE.mensagens.filter(m => m.id > 0);
  if (!salvas.length) return;
  const lastId = salvas[salvas.length - 1].id;
  const data = await fetchMensagens({ after_id: lastId });
  if (data && data.mensagens && data.mensagens.length) {
    // re-render so novas msgs (preservando scroll perto do bottom)
    const msgsEl = document.getElementById('messagesEl');
    const atBottom = msgsEl && (msgsEl.scrollTop + msgsEl.clientHeight + 50 >= msgsEl.scrollHeight);
    renderChat();
    if (atBottom) scrollToBottom();
  } else if (data && data.conv_info) {
    // atualiza status (ex: lido → ✓✓ azul) sem re-render disruptivo
    // pra simplificar, re-renderiza só se status mudou em alguma msg visivel — pulamos por ora
  }
}

// A mídia do cliente é baixada logo depois que a mensagem chega — a bolha que
// já foi desenhada como "[audio]" precisa se atualizar quando o arquivo existe.
const RE_MIDIA_PENDENTE = /^\[(audio|image|video|document)\]/;
async function atualizarMidiasPendentes() {
  // Só as que ainda podem chegar. Sem isso o inbox ficava pedindo pra sempre a
  // mídia de mensagens antigas que a Meta já apagou.
  const pendentes = STATE.mensagens.filter(
    m => m.id > 0 && !m.midia_url && m.midia_estado === 'baixando' && RE_MIDIA_PENDENTE.test(m.texto || '')
  );
  if (!pendentes.length) return;
  const ids = pendentes.slice(-20).map(m => m.id).join(',');
  try {
    const r = await fetch('/crm/inbox/api/mensagens/?tel=' + encodeURIComponent(STATE.telSelecionado) + '&ids=' + ids);
    const data = await r.json();
    let mudou = false;
    (data.mensagens || []).forEach(nova => {
      if (!nova.midia_url) return;
      const i = STATE.mensagens.findIndex(m => m.id === nova.id);
      if (i >= 0) { STATE.mensagens[i] = nova; mudou = true; }
    });
    if (mudou) {
      const msgsEl = document.getElementById('messagesEl');
      const atBottom = msgsEl && (msgsEl.scrollTop + msgsEl.clientHeight + 50 >= msgsEl.scrollHeight);
      renderChat();
      if (atBottom) scrollToBottom();
    }
  } catch (e) { /* tenta de novo no próximo tick */ }
}

// Polling intervals
setInterval(atualizarMidiasPendentes, 4000); // mídia que chegou depois da bolha
setInterval(pollNovasMensagens, 3000);     // mensagens da conversa ativa: 3s
setInterval(fetchConversas, 10000);         // sidebar conversas: 10s

// ============ INIT ============
document.getElementById('searchInput').addEventListener('input', e => {
  STATE.busca = e.target.value.trim();
  clearTimeout(window._buscaTimer);
  window._buscaTimer = setTimeout(fetchConversas, 300);
});

fetchConversas();
carregarRespostas();

// expor pra debug
window.STATE = STATE;
window.limparArquivo = limparArquivo;
</script>
